name: Radar B2B Autopilot

on:
  schedule:
    # 8:00 AM to 8:00 PM IST every two hours
    - cron: '30 2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crm-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests beautifulsoup4 google-genai dnspython aiohttp tenacity ddgs
          
      - name: Run Master Autopilot Engine
        env:
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python autopilot.py

      # Auto-Save backup system with collision prevention
      - name: Save Backup (seen_links.txt) to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.txt || true
          git commit -m "Auto-update seen_links.txt [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true

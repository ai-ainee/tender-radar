name: Run B2B Radar

on:
  schedule:
    # Runs every 2 hours between 02:30 UTC and 14:30 UTC (8:00 AM - 8:00 PM IST)
    - cron: '30 2-14/2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pydantic pypdf google-genai duckduckgo-search

      - name: Execute Radar Intelligence Engine
        env:
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python radar.py

      - name: Save memory (Commit seen links)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt
          git commit -m "Update scraped memory [skip ci]" || echo "No new links to commit"
          git push

name: Run B2B Radar

on:
  schedule:
    - cron: '30 2-14/2 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    
    # THIS IS THE MAGIC BULLET: Forces GitHub to allow saving the memory file
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pydantic pypdf google-genai duckduckgo-search googlenewsdecoder

      - name: Execute Radar Intelligence Engine
        env:
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_BUYERS: ${{ secrets.TELEGRAM_CHAT_ID_BUYERS }}
          TELEGRAM_CHAT_ID_TENDERS: ${{ secrets.TELEGRAM_CHAT_ID_TENDERS }}
          TELEGRAM_CHAT_ID_HIRING: ${{ secrets.TELEGRAM_CHAT_ID_HIRING }}
          TELEGRAM_CHAT_ID_CAPEX: ${{ secrets.TELEGRAM_CHAT_ID_CAPEX }}
          TELEGRAM_CHAT_ID_CORP: ${{ secrets.TELEGRAM_CHAT_ID_CORP }}
          TELEGRAM_CHAT_ID_SUPPLIERS: ${{ secrets.TELEGRAM_CHAT_ID_SUPPLIERS }}
          TELEGRAM_CHAT_ID_INDUSTRY_MEDIA: ${{ secrets.TELEGRAM_CHAT_ID_INDUSTRY_MEDIA }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python radar.py

      - name: Save memory (Commit seen links)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt
          git commit -m "Update scraped memory [skip ci]" || echo "No new links to commit"
          git push

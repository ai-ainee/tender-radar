name: Indian Commercial Radar

on:
  schedule:
    # 02:30 UTC to 14:30 UTC = 08:00 AM to 08:00 PM IST
    - cron: '30 2-14 * * *'
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pydantic tenacity beautifulsoup4

      - name: Run Lead Radar
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
        run: python radar.py

      - name: Commit updated seen links
        run: |
          git config --global user.name "LeadRadarBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_links.txt
          git commit -m "Update seen links [skip ci]" || echo "No changes to seen_links.txt"
          git push

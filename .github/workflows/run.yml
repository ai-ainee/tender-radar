name: Radar Enterprise Auto-Scanner V2

on:
  schedule:
    # Runs at 8:30 AM, 10:30 AM, 12:30 PM, 2:30 PM, 4:30 PM, 6:30 PM, 8:30 PM IST (Mon-Fri)
    # (UTC times: 03:00, 05:00, 07:00, 09:00, 11:00, 13:00, 15:00)
    - cron: '0 3,5,7,9,11,13,15 * * 1-5'
  
  # Allows you to click "Run workflow" manually whenever you want
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📡 Phase 1 - Run Radar (The Scout)
        env:
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python radar.py

      - name: 🕵️‍♂️ Phase 2 - Run Deep Hunter (The Detective)
        env:
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python deep_hunter.py

      - name: 🚨 Critical Failure Alert (Heartbeat Monitor)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="🚨 *CRITICAL ALERT:* The Radar V2 Engine just crashed in GitHub Actions! Please check the logs immediately." \
          -d parse_mode="Markdown"

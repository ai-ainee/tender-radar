name: Radar B2B Autopilot

on:
  schedule:
    # Runs every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch: # 🚨 This adds a manual "Run workflow" button so you can test it anytime!

jobs:
  run-radar-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests beautifulsoup4 google-generativeai dnspython

      - name: 📡 Run Radar Engine (radar.py)
        env:
          # This securely pulls your hidden keys from GitHub Secrets
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

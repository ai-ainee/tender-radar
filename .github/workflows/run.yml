name: Enterprise Radar Pipeline

on:
  schedule:
    # Runs every hour from 8 AM to 8 PM IST (02:30 UTC to 14:30 UTC)
    - cron: '30 2-14 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pydantic pypdf google-genai

      - name: Run Enterprise Radar
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dedicated Media Channel Secret
          TELEGRAM_CHAT_ID_INDUSTRY_MEDIA: ${{ secrets.TELEGRAM_CHAT_ID_INDUSTRY_MEDIA }}
          # All State-Specific Telegram Secrets
          TELEGRAM_CHAT_ID_DELHI: ${{ secrets.TELEGRAM_CHAT_ID_DELHI }}
          TELEGRAM_CHAT_ID_MAHARASHTRA: ${{ secrets.TELEGRAM_CHAT_ID_MAHARASHTRA }}
          TELEGRAM_CHAT_ID_KARNATAKA: ${{ secrets.TELEGRAM_CHAT_ID_KARNATAKA }}
          TELEGRAM_CHAT_ID_TAMIL_NADU: ${{ secrets.TELEGRAM_CHAT_ID_TAMIL_NADU }}
          TELEGRAM_CHAT_ID_UTTAR_PRADESH: ${{ secrets.TELEGRAM_CHAT_ID_UTTAR_PRADESH }}
          TELEGRAM_CHAT_ID_GUJARAT: ${{ secrets.TELEGRAM_CHAT_ID_GUJARAT }}
          TELEGRAM_CHAT_ID_TELANGANA: ${{ secrets.TELEGRAM_CHAT_ID_TELANGANA }}
          TELEGRAM_CHAT_ID_ANDHRA_PRADESH: ${{ secrets.TELEGRAM_CHAT_ID_ANDHRA_PRADESH }}
          TELEGRAM_CHAT_ID_HARYANA: ${{ secrets.TELEGRAM_CHAT_ID_HARYANA }}
          TELEGRAM_CHAT_ID_RAJASTHAN: ${{ secrets.TELEGRAM_CHAT_ID_RAJASTHAN }}
          TELEGRAM_CHAT_ID_MADHYA_PRADESH: ${{ secrets.TELEGRAM_CHAT_ID_MADHYA_PRADESH }}
          TELEGRAM_CHAT_ID_WEST_BENGAL: ${{ secrets.TELEGRAM_CHAT_ID_WEST_BENGAL }}
          TELEGRAM_CHAT_ID_KERALA: ${{ secrets.TELEGRAM_CHAT_ID_KERALA }}
          TELEGRAM_CHAT_ID_PUNJAB: ${{ secrets.TELEGRAM_CHAT_ID_PUNJAB }}
          TELEGRAM_CHAT_ID_BIHAR: ${{ secrets.TELEGRAM_CHAT_ID_BIHAR }}
          TELEGRAM_CHAT_ID_ODISHA: ${{ secrets.TELEGRAM_CHAT_ID_ODISHA }}
          TELEGRAM_CHAT_ID_JHARKHAND: ${{ secrets.TELEGRAM_CHAT_ID_JHARKHAND }}
          TELEGRAM_CHAT_ID_CHHATTISGARH: ${{ secrets.TELEGRAM_CHAT_ID_CHHATTISGARH }}
          TELEGRAM_CHAT_ID_ASSAM: ${{ secrets.TELEGRAM_CHAT_ID_ASSAM }}
          TELEGRAM_CHAT_ID_UTTARAKHAND: ${{ secrets.TELEGRAM_CHAT_ID_UTTARAKHAND }}
        run: |
          python radar.py

      - name: Commit and Push seen links
        run: |
          git config --global user.name "LeadRadarBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_links.txt
          git commit -m "Update seen links [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main

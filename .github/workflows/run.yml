name: Indian Commercial Radar

on:
  schedule:
    - cron: '0 */2 * * *'   # Runs automatically every 2 hours
  workflow_dispatch:        # Allows you to click a button to test anytime

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests google-genai

      - name: Run Lead Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK: ${{ secrets.GOOGLE_SHEET_WEBHOOK }}
        run: python radar.py

      - name: Save history to avoid duplicate alerts
        run: |
          git config --global user.name "LeadRadarBot"
          git config --global user.email "bot@github.com"
          git add seen_links.txt || true
          git commit -m "Update seen links" || exit 0
          git push

name: Radar Scout Automation Engine

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST
    - cron: '30 5 * * *' # 11:00 AM IST
  workflow_dispatch:

env:
  TZ: 'Asia/Kolkata'

jobs:
  run-radar-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants git push write access for seen_links.txt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Harvester (8:00 AM IST)
        if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }} # Added Security Secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # Added for Alerts
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} # Added for Alerts
        run: python radar.py

      - name: Run Enrichment Worker (11:00 AM IST)
        if: github.event.schedule == '30 5 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }} # Added Security Secret
          # Add Telegram secrets here too if your enrichment worker uses them
        run: python enrichment_worker.py

      - name: Save Cache to Repository
        if: always()  # Saves cache even if run is terminated or errors occur
        run: |
          git config --global user.name "Radar Scout Bot"
          git config --global user.email "bot@radarscout.local"
          git add seen_links.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scraped links cache" && git push)

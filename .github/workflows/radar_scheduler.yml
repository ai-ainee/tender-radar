name: Test Radar Scout Logic (offline)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Apps Script syntax and CRM dedupe rules
        run: |
          node --check < Code.gs
          node tests/test_apps_script.js

name: Radar Scout Automation Engine

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST  -> harvester
    - cron: '30 5 * * *'   # 11:00 AM IST -> enrichment
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run'
        type: choice
        default: both
        options:
          - both
          - harvest
          - enrich

permissions:
  contents: write          # lets the bot commit seen_links.txt

concurrency:
  group: radar-scout
  cancel-in-progress: false

env:
  TZ: 'Asia/Kolkata'
  PYTHONUNBUFFERED: '1'

jobs:
  run-radar-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
      BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTRA_LLM_BASE_URL: ${{ secrets.EXTRA_LLM_BASE_URL }}
      EXTRA_LLM_API_KEYS: ${{ secrets.EXTRA_LLM_API_KEYS }}
      EXTRA_LLM_MODELS: ${{ secrets.EXTRA_LLM_MODELS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run harvester
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'harvest'))
        run: python radar.py

      - name: Run enrichment worker
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'enrich'))
        run: python enrichment_worker.py

      # Persist the de-duplication cache even if a step above failed
      - name: Save seen-links cache
        if: always()
        run: |
          git config user.name "Radar Scout Bot"
          git config user.email "bot@radarscout.local"
          git add seen_links.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            git commit -m "chore: update seen links cache [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || echo "Push failed (will retry on next run)"
          fi

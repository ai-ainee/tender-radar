name: Radar Scout Automation Engine

on:
  schedule:
    - cron: '45 1 * * *'
    - cron: '30 2,4,6,8,10,12,14 * * *'

  workflow_dispatch:
    inputs:
      target_job:
        description: 'Select process to trigger manually'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - scout
          - enrichment

env:
  TZ: 'Asia/Kolkata'

# CONCURRENCY GUARD: Ensures simultaneous triggers don't corrupt the cache
concurrency:
  group: radar-scout-engine
  cancel-in-progress: false

jobs:
  run-radar-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ddgs

      - name: Run Harvester
        if: >
          github.event.schedule == '45 1 * * *' ||
          (github.event_name == 'workflow_dispatch' && (inputs.target_job == 'both' || inputs.target_job == 'scout'))
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python radar.py

      - name: Run Enrichment Worker
        if: >
          github.event.schedule == '30 2,4,6,8,10,12,14 * * *' ||
          (github.event_name == 'workflow_dispatch' && (inputs.target_job == 'both' || inputs.target_job == 'enrichment'))
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python enrichment_worker.py

      # REBASE FIX: Guarantees successful cache saves even when triggers overlap
      - name: Save Cache to Repository
        if: always()
        run: |
          git config --global user.name "Radar Scout Bot"
          git config --global user.email "bot@radarscout.local"
          git add seen_links.txt
          git diff --quiet && git diff --staged --quiet || (git pull --rebase origin main && git commit -m "Auto-update scraped links cache [skip ci]" && git push)

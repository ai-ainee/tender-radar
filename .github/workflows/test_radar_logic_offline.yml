              '_is_vendor_domain':lambda u:False, '_is_content_page':lambda u:False,
              '_is_vendor_self_reference':lambda a,b:False, '_is_staffing_agency':lambda x:False,
              'normalize_company':lambda s:s.strip(), 'apply_quality_gates':lambda l,c:(l,[]),
              '_fp_key':lambda fp:'', '_classify_gates':lambda flags:([],[]),

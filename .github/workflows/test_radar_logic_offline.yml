              '_unverified_corporate_public':lambda lead:False,
              'extract_phone':lambda v:'', 'safe_cell':lambda s:s,
          }
          exec(compile(ast.Module(body=[formatter,router],type_ignores=[]),'step47c_extract','exec'),ctx)
          Router=ctx['Router']
          format_lead=ctx['_format_lead']
          checks=0

          def check(label, cond):
              global checks
              assert cond, label
              checks += 1
              print('PASS Step47D:',label)

          md={'internal_source':'gem','verification_status':'unverified_index',
              'provisional_tender':True,'official_source_verified':False,
              'active_tender_verified':False,'buyer_verified':False,'current_deadline_verified':False,
              'snippet_only':True,'indexed_bid_reference':'GEM/2026/B/7654321'}

          def lead_with(metadata, bid='GEM/2026/B/7654321'):
              return StandardLead(source='tenders',category='tender',tender_id=bid,
                  url='https://example-tender-board.in/tender/reference-123456789',
                  title=f'Example product renewal {bid}',
                  snippet='Third-party result: Example Parent Ministry, 13 Nov deadline.',
                  raw_text='Third-party result: Example Parent Ministry, 13 Nov deadline.',
                  metadata=dict(metadata))

          lead=lead_with(md)
          formatted=format_lead(lead,0)
          check('AI prompt labels GeM reference unverified', 'SOURCE_VERIFICATION: UNVERIFIED_GEM_REFERENCE' in formatted)
          check('AI prompt flags buyer and deadline unverified', 'BUYER_VERIFIED: NO' in formatted and 'CURRENT_DEADLINE_VERIFIED: NO' in formatted)
          check('AI prompt warns against artificial urgency', 'Never treat an indexed deadline as current' in formatted)
          check('AI prompt preserves canonical tender ID', f'TENDER_ID: {lead.tender_id}' in formatted)

          s=Sheet()
          r=Router(s)
          result=r.push(lead,{
              'organization':'Example Parent Ministry', 'is_valid':True,
              'confidence':'HIGH','entity_role':'BUYER', 'lead_score':87,
              'why_engage_now':'Urgent: tender closing soon on 13 Nov 2026; submit immediately!',
              'upcoming_events':'Submit bid before 13 Nov 2026',
              'signal_freshness':'RECENT',
          },'Example technology','ALL_SECTORS')
          check('unverified index stays Review even when AI says HIGH',result[0]=='REVIEW')
          assert len(s.posts)==1
          row=s.posts[0][1]['row_data']
          check('CRM upcoming event no longer claims unverified deadline', '13 Nov' not in row[1] and 'verification' in row[1].lower())
          check('CRM signal removes AI closing-soon claim', 'closing soon' not in row[8].lower() and 'submit immediately' not in row[8].lower())
          check('CRM signal preserves explicit unverified notice', 'GEM NOT OFFICIALLY VERIFIED' in row[8])
          check('CRM discloses unverified actual buyer', 'actual procuring unit NOT VERIFIED' in row[8] and 'Example Parent Ministry' in row[8])
          check('CRM preserves bid identity', 'GEM/2026/B/7654321' in row[8])
          check('AI score is explicitly not purchase proof', 'not confirmation of demand' in row[8])
          check('submitted signal and row match',s.posts[0][1]['signal_brief']==row[8])
          check('routing does not overwrite tender identity',lead.tender_id=='GEM/2026/B/7654321')
          check('metadata provenance remains untouched',lead.metadata==md)

          other=lead_with({'internal_source':'other'},bid='OTHER/2026/12345')
          s2=Sheet()
          r2=Router(s2)
          out2=r2.push(other,{'organization':'Example Buyer Ltd','is_valid':True,
              'confidence':'HIGH','entity_role':'BUYER','lead_score':88,
              'upcoming_events':'Submission closes 13 Nov',
              'why_engage_now':'Closing soon: 13 Nov 2026','signal_freshness':'RECENT'},
              'Example service','ALL_SECTORS')
          check('non-GeM routing remains Inbox',out2[0]=='INBOX')
          check('non-GeM event text untouched',s2.posts[0][1]['row_data'][1]=='Submission closes 13 Nov')

          verified={'internal_source':'gem','verification_status':'official_listing_link',
              'official_source_verified':True,'active_tender_verified':True,
              'provisional_tender':False,'buyer_verified':True,
              'current_deadline_verified':True}
          good=lead_with(verified)

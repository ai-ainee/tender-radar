          class Logger:
              def info(self, *a): pass
              def warning(self, *a): pass
              def error(self, *a): pass

          ctx={
              'datetime':datetime,'hashlib':hashlib,'json':json,'os':os,'re':re,'uuid':uuid,'urlparse':urlparse,
              'log':Logger(), 'SHEET_INBOX':'Inbox','SHEET_REVIEW':'Review','SHEET_PARTNERS':'Partners',

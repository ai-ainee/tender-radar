name: Test Radar Scout Logic (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Verify required source files exist
        run: |
          test -f radar.py
          test -f adapters/tenders.py
          test -f sources/gem.py
          test -f standard_lead.py
          test -f common.py
          test -f sources/cppp.py
          test -f sources/india_gov_portals.py
          test -f pending_candidates.py
          test -f sources/corporate_intelligence.py
          test -f adapters/corporate_intelligence.py
          test -f tests/test_step52_corporate.py
          test -f tools/source_coverage_report.py
      - name: Compile core Python files
        run: python -m py_compile radar.py adapters/tenders.py sources/gem.py standard_lead.py common.py sources/cppp.py sources/india_gov_portals.py adapters/aggregator_tenders.py pending_candidates.py adapters/corporate_intelligence.py sources/corporate_intelligence.py adapters/__init__.py
      - name: Test GeM provenance and final CRM routing decisions (offline)
        env:
          RADAR_TRASH_LOCAL_AUDIT: '0'
        run: |
          python - <<'PY'
          import ast, os, hashlib, uuid, re, logging
          from pathlib import Path
          from datetime import datetime
          from urllib.parse import urlparse

          os.environ["RADAR_TRASH_LOCAL_AUDIT"] = "0"
          code = Path('radar.py').read_text(encoding='utf-8')
          from standard_lead import StandardLead
          class Sheet:
              def __init__(self): self.posts=[]
              def post(self, action, **kwargs):
                  self.posts.append((action,kwargs))
                  return {'status':'success'}
          class Logger:
              def __init__(self): self.messages=[]
              def info(self, *xs): self.messages.append(('info',xs))
              def warning(self, *xs): self.messages.append(('warning',xs))
              def error(self, *xs): self.messages.append(('error',xs))

          n=ast.parse(code)
          router=next(x for x in n.body if isinstance(x,ast.ClassDef) and x.name=='Router')
          env={
              'datetime':datetime, 'hashlib':hashlib, 'uuid':uuid, 're':re,'urlparse':urlparse, 'os':os,
              'log': Logger(), 'SHEET_INBOX':'Inbox','SHEET_REVIEW':'Review','SHEET_PARTNERS':'Partners',
              'SHEET_TRASH':'Trash','SHEET_MANUAL':'Manual', 'DRY_RUN': False,
              '_is_vendor_domain':lambda u:False,'_is_content_page':lambda u:False,
              '_is_vendor_self_reference':lambda a,b:False,
              '_is_staffing_agency':lambda x:False,
              'normalize_company':lambda s:s.strip(),
              'apply_quality_gates':lambda lead,c:(lead,[]),
              '_fp_key':lambda x:'', '_classify_gates':lambda flags:([],[]),
              '_other_unverified_government_tender':lambda lead:False,
              '_unverified_corporate_public':lambda lead:False,
              'extract_phone':lambda v:'', 'safe_cell':lambda s:s,
          }
          exec(compile(ast.Module(body=[router],type_ignores=[]), 'router_extract','exec'),env)
          Router=env['Router']
          def test_case(label, md, valid=True, confidence='HIGH', organization='Example Infra Ltd', intended='Review', adversarial=False):
              sheet=Sheet(); router=Router(sheet)
              lead=StandardLead(source='tenders', category='tender', url='https://example.com/gem-bid',
                              title='GEM/2026/B/1234567', snippet='Bidding',raw_text='Bidding for Revit',
                              metadata=md)
              verdict={'organization':organization,'is_valid':valid, 'confidence':confidence,
                       'entity_role':'BUYER','lead_score':99,'why_engage_now':'Procurement',
                       'signal_freshness':'RECENT'}
              if adversarial:
                  verdict.update({'metadata':{'internal_source':'unknown','active_tender_verified':True},
                                  'source':'filings','category':'filing','url':'https://other.com'})
              outcome, company, reason=router.push(lead,verdict,'Revit','ALL_SECTORS')
              assert outcome == {'Review':'REVIEW','Inbox':'INBOX','Trash':'TRASH','Manual':'MANUAL'}[intended], (label,outcome,intended,reason)
              if intended in ('Review','Inbox','Manual'):
                  assert len(sheet.posts)==1,(label,sheet.posts)
                  assert sheet.posts[0][1]['target_sheet']==intended,(label,sheet.posts[0][1])
              if intended=='Review':
                  row=sheet.posts[0][1]['row_data']
                  assert 'GEM NOT OFFICIALLY VERIFIED' in row[8] if md.get('internal_source')=='gem' else True, (label,row)
              if adversarial:
                  assert lead.metadata==md,(label,lead.metadata)
                  assert lead.source=='tenders' and lead.url=='https://example.com/gem-bid' and lead.category=='tender'
              print('PASS',label,'->',outcome)

          m0={'internal_source':'gem','verification_status':'unverified_index','provisional_tender':True,'official_source_verified':False,'active_tender_verified':False}
          test_case('unverified GeM high confidence',m0, intended='Review')
          test_case('unverified GeM high confidence / adversarial verdict',m0, intended='Review',adversarial=True)
          test_case('unverified GeM low confidence',m0,confidence='LOW',intended='Review')
          test_case('unverified GeM invalid',m0,valid=False,intended='Trash')
          test_case('unverified GeM missing buyer',dict(m0, snippet_only=True), organization='', intended='Manual')
          m1={'internal_source':'gem','verification_status':'official_listing_link','provisional_tender':False,'official_source_verified':True,'active_tender_verified':False}
          test_case('official link but active status unknown',m1,intended='Review')
          m2={**m1,'active_tender_verified':True}
          test_case('hypothetically officially verified and active',m2,intended='Inbox')
          m3={'internal_source':'gem'}
          test_case('missing verification fields fail closed',m3,intended='Review')
          m4={'internal_source':'other'}
          test_case('non-GeM unchanged',m4,intended='Inbox')
          print('ALL 9 CASES PASSED')

          # Adapter provenance: extract pure mapping functions; no source adapters are run.
          source_ast = ast.parse(Path('adapters/tenders.py').read_text(encoding='utf-8'))
          source_funcs = [n for n in source_ast.body if isinstance(n, ast.FunctionDef)
                          and n.name in ('_gem_source_status', '_gem_bid_refs', '_safe_gem_tender_id', '_dict_to_lead')]
          assert len(source_funcs) == 4, 'Missing tender provenance / ID mapping helper functions'
          source_constants = [n for n in source_ast.body if isinstance(n, ast.Assign)
                              and any(isinstance(t, ast.Name) and t.id in ('_GEM_REF', '_GEM_DIRECT_PATH')
                                      for t in n.targets)]
          source_env = {'StandardLead': StandardLead, 're': re, 'urlparse': urlparse, 'log': logging.getLogger('offline-tender-mapping')}
          exec(compile(ast.Module(body=source_constants + source_funcs, type_ignores=[]), 'tenders_extract', 'exec'), source_env)
          convert = source_env['_dict_to_lead']
          indexed = convert('gem', {
              'url': 'https://example-tenders.in/tender/ref',
              'title': 'Revit software tender GEM/2026/B/1234567',
              'snippet': 'Index result for GEM/2026/B/1234567',
          })
          assert indexed.metadata['verification_status'] == 'unverified_index'
          assert indexed.metadata['provisional_tender'] is True
          assert indexed.metadata['active_tender_verified'] is False
          assert indexed.metadata['indexed_bid_reference'] == 'GEM/2026/B/1234567'
          print('PASS indexed GeM provenance -> unverified_index')

          official_link = convert('gem', {
              'url': 'https://bidplus.gem.gov.in/showbidDocument/1234567',
              'title': 'Bid for software', 'snippet': 'Official listing only',
          })
          assert official_link.metadata['active_tender_verified'] is False
          print('PASS official GeM listing alone does not prove active bid')
          PY

      - name: Test Step40A/40B canonical IDs and provisional tender cache guard (offline)
        run: |
          python - <<'PY'
          """Test current repo files without network, AI, webhook or imported adapters."""
          import ast
          import logging
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          from standard_lead import StandardLead

          def source_functions(path, names, variables=()):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              funcs = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in names]
              assert {n.name for n in funcs} == set(names), f'Missing required functions in {path}'
              constants = [n for n in tree.body if isinstance(n, ast.Assign) and
                  any(isinstance(t, ast.Name) and t.id in variables for t in n.targets)]
              return tree, constants + funcs

          _, tender_nodes = source_functions('adapters/tenders.py',
              {'_gem_source_status','_gem_bid_refs','_safe_gem_tender_id','_dict_to_lead'},
              {'_GEM_REF','_GEM_DIRECT_PATH'})
          env = {'StandardLead': StandardLead, 're': re, 'urlparse': urlparse,
                 'log': logging.getLogger('step40c')}
          exec(compile(ast.Module(body=tender_nodes, type_ignores=[]), 'step40c_tenders', 'exec'), env)
          convert = env['_dict_to_lead']

          radar_tree, cache_nodes = source_functions('radar.py',
              {'_unverified_gem_reference', '_other_unverified_government_tender', '_can_cache_tender_id'})
          cache = {'_unverified_corporate_public':lambda lead:False}
          exec(compile(ast.Module(body=cache_nodes, type_ignores=[]), 'step40c_cache', 'exec'), cache)
          is_unverified = cache['_unverified_gem_reference']
          can_cache = cache['_can_cache_tender_id']

          # Check the guard is used at the actual dedup and cache-write call sites.
          guard_calls = [n for n in ast.walk(radar_tree) if isinstance(n, ast.Call)
                         and isinstance(n.func, ast.Name) and n.func.id == '_can_cache_tender_id']

          bid = 'GEM/2026/B/8231919'
          def sample(url, title='AutoCAD renewal GEM/2026/B/8231919',
                     snippet='Bid GEM/2026/B/8231919', metadata=None):
              return dict(url=url, title=title, snippet=snippet,
                          metadata=metadata if metadata is not None else
                          {'indexed_bid_reference':bid, 'provisional':True,
                           'verification_status':'unverified_index'})

          checked = 0
          def check(name, condition):
              global checked
              assert condition, name
              checked += 1
              print('PASS Step40:', name)

          a = convert('gem', sample('https://tenderimpulse.com/government-tenders/india/autocad-renewal'))
          b = convert('gem', sample('https://tenderkart.in/tender/another-autocad-renewal'))
          check('canonical tender_id from GeM index', a.tender_id == bid)
          check('stable lead ID across distinct listing URLs', a.id == b.id and a.id == a.compute_id())
          check('provisional source metadata preserved', a.metadata['provisional_tender'] is True and
                a.metadata['verification_status']=='unverified_index' and
                a.metadata['active_tender_verified'] is False)
          check('provisional GeM tender not permanently cached', is_unverified(a) and not can_cache(a))
          check('normalise spacing and case in bid IDs', convert('gem', sample(
                'https://example.org/tender/one', title='gem / 2026 / b / 8231919 renewal',
                metadata={'indexed_bid_reference':'gem / 2026 / b / 8231919','provisional':True})).tender_id == bid)
          check('reject conflicting title and snippet IDs', not convert('gem', sample(
                'https://example.org/tender/two',snippet='GEM/2026/B/8888888')).tender_id)
          check('reject conflicting index metadata', not convert('gem', sample(
                'https://example.org/tender/three',metadata={
                'indexed_bid_reference':'GEM/2026/B/8888888','provisional':True})).tender_id)
          check('reject malformed indexed metadata', not convert('gem', sample(
                'https://example.org/tender/four',metadata={
                'indexed_bid_reference':'not a valid reference','provisional':True})).tender_id)
          check('no ID invented for unnamed bid', not convert('gem', sample(
                'https://bidplus.gem.gov.in/showbidDocument/10117601',
                title='AutoCAD software tender',snippet='bid listing',metadata={})).tender_id)
          official = convert('gem', sample('https://bidplus.gem.gov.in/showbidDocument/10117601',
                metadata={'verification_status':'official_listing_link'}))
          check('official listing alone is not proof of active tender',
                official.tender_id==bid and not can_cache(official))
          verified = StandardLead(source='tenders',category='tender',url='https://example.org/verified',
                tender_id=bid,metadata={'internal_source':'gem',
                'verification_status':'official_listing_link',
                'official_source_verified':True,'active_tender_verified':True,
                'provisional_tender':False})
          check('verified active GeM is eligible for tender cache',can_cache(verified))
          other = StandardLead(source='tenders',category='tender',url='https://example.org/other',
                tender_id='CPP/2026/123',metadata={'internal_source':'cppp'})
          check('non-GeM tender cache remains unchanged',can_cache(other))
          check('cache guard used at actual routing call sites',len(guard_calls)>=4)
          cloned = StandardLead.from_dict(a.to_dict())
          check('serialisation preserves canonical ID', cloned.tender_id == bid and cloned.id == a.id)
          print(f'ALL {checked} STEP40 CHECKS PASSED')
          PY

      - name: Test Step36 indexed GeM bid extraction and ambiguity (offline)
        run: |
          python - <<'PY'
          """Step 37C: offline checks of the repository's current sources/gem.py. Network-free."""
          import ast
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          code = Path('sources/gem.py').read_text(encoding='utf-8')
          tree = ast.parse(code)
          needed_constants = {'GEM_HOST', 'BID_LINK', 'BID_NUMBER', 'LANDING_SEGMENTS'}
          needed_functions = {'_normalise_bid_link', '_candidate_url', '_indexed_fallback', '_extract_items'}
          selected = [node for node in tree.body if
              (isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id in needed_constants for t in node.targets))
              or (isinstance(node, ast.FunctionDef) and node.name in needed_functions)]
          assert {n.name for n in selected if isinstance(n, ast.FunctionDef)} == needed_functions, 'Step36 functions missing'

          class FakeSearch:
              results = []
              def search(self, query, **kwargs):
                  return list(self.results)

          class Logger:
              def __init__(self): self.messages = []
              def info(self, msg, *args): self.messages.append(('INFO', msg % args if args else msg))
              def warning(self, msg, *args): self.messages.append(('WARN', msg % args if args else msg))

          logger = Logger()
          env = {'re': re, 'datetime': datetime, 'urljoin': urljoin, 'urlparse': urlparse,
                 'SearchEngine': FakeSearch, 'log': logger}
          exec(compile(ast.Module(body=selected, type_ignores=[]), 'gem_step36_extract', 'exec'), env)
          collect = env['_indexed_fallback']
          check_url = env['_candidate_url']
          extract_official = env['_extract_items']
          Y = datetime.now().year
          bid1 = f'GEM/{Y}/B/8231919'
          bid2 = f'GEM/{Y}/B/7345678'
          bid3 = f'GEM/{Y}/B/9654321'
          url1 = 'https://example-tenders.in/tender/suite-renewal-123456'
          base = {'link': url1, 'title': f'{bid1} SampleCAD subscription renewal',
                  'snippet': 'SampleCAD renewal, two seats'}
          passed = 0
          def check(label, ok):
              global passed
              assert ok, label
              passed += 1
              print('PASS Step36:',label)

          FakeSearch.results = [base]
          out = collect(['SampleCAD'],80)
          check('find one indexed bid', len(out) == 1)
          md = out[0]['metadata'] if out else {}
          check('exact bid number and source domain preserved',
                md.get('indexed_bid_reference') == bid1 and md.get('source_index_domain') == 'example-tenders.in')
          check('unverified and corrigendum check required',
                md.get('verification_status') == 'unverified_index' and
                md.get('provisional') is True and md.get('requires_corrigendum_check') is True)
          check('buyer, deadline, specification and active status not invented',
                all(md.get(k) is False for k in
                    ('buyer_verified','current_deadline_verified','specification_verified','active_tender_verified')))
          check('AI-facing text warns dates can change',
                'corrigenda' in out[0]['snippet'].lower() and 'NOT verified' in out[0]['snippet'])

          FakeSearch.results = [base, dict(base, link='https://example-tenders.in/tender/suite-renewal-other')]
          out = collect(['SampleCAD','OtherCAD'],80)
          check('same bid on multiple pages deduplicated', len(out) == 1)

          FakeSearch.results = [dict(base, title=f'{bid1} {bid2} SampleCAD tender')]
          check('two bid IDs in title rejected', not collect(['SampleCAD'],80))
          FakeSearch.results = [dict(base, title='SampleCAD tender listing',
                                     snippet=f'{bid1} and {bid2} SampleCAD')]
          check('two bid IDs in snippet rejected', not collect(['SampleCAD'],80))
          FakeSearch.results = [dict(base, snippet=f'{bid2} another unrelated project SampleCAD')]
          out = collect(['SampleCAD'],80)
          check('one title ID preferred to unrelated snippet ID',
                len(out) == 1 and out[0]['metadata']['indexed_bid_reference'] == bid1)
          FakeSearch.results = [dict(base, title=f'{bid3} SampleCAD', snippet='SampleCAD')]
          check('dynamic keyword matching without hardcoded product names',
                collect(['SampleCAD'],80)[0]['metadata']['matched_target']=='SampleCAD')
          check('reject generic tender category landing pages',
                not check_url('https://www.tendersontime.com/indiaproducts/indian-autodesk-tenders-16120/'))
          check('accept only GeM bid-specific URLs',
                check_url('https://bidplus.gem.gov.in/showbidDocument/10117601') and
                not check_url('https://bidplus.gem.gov.in/all-bids'))

          class Page:
              def evaluate(self, *args):
                  return [{'href': 'https://bidplus.gem.gov.in/showbidDocument/10117601',
                           'text': 'SampleCAD software two seats'}]
          official = extract_official(Page(), ['SampleCAD'],80)
          check('official HTML listing is not active-bid confirmation',
                len(official) == 1 and official[0]['metadata']['verification_status'] == 'official_listing_link' and
                official[0]['metadata']['active_tender_verified'] is False)
          print(f'ALL {passed} STEP36 CHECKS PASSED')
          PY
      - name: Test Step44 bounded GeM recheck cooldown and persistence (offline)
        run: |
          python - <<'PY'
          """Isolated, offline Step 44 gate/cache regression tests. Does not import radar.py or call live services."""
          from pathlib import Path
          from types import SimpleNamespace
          from datetime import datetime, date, timedelta
          import ast, json, os, logging, hashlib, re, tempfile

          ROOT = Path.cwd()
          SOURCE = (ROOT / 'radar.py').read_text(encoding='utf-8')
          TREE = ast.parse(SOURCE)
          log = logging.getLogger('step44-tests')
          checks = 0

          def check(condition, description):
              global checks
              assert condition, description
              checks += 1
              print('PASS:', description)

          # Compile the exact helpers from the replacement, without running imports or main().
          helper_names = {'_unverified_gem_reference', '_other_unverified_government_tender', '_can_cache_tender_id', '_provisional_gem_id',
                          'load_gem_recheck_state', '_gem_recheck_due', '_record_gem_attempt'}
          funcs = [x for x in TREE.body if isinstance(x, ast.FunctionDef) and x.name in helper_names]
          check(len(funcs) == 7, 'all seven provenance/cache helpers are present')
          namespace = {'re':re, 'json':json, 'os':os, 'datetime':datetime, 'log':log,
                       '_unverified_corporate_public':lambda lead:False,
                       'GEM_RECHECK_FILE':str(ROOT/'test_gem_recheck_state.json'), 'DRY_RUN':True}
          exec(compile(ast.Module(body=funcs,type_ignores=[]), 'radar_helpers', 'exec'), namespace)
          unverified = namespace['_unverified_gem_reference']
          provisional = namespace['_provisional_gem_id']
          due = namespace['_gem_recheck_due']
          read = namespace['load_gem_recheck_state']
          write = namespace['_record_gem_attempt']

          BASE_MD = {'internal_source':'gem', 'verification_status':'unverified_index',
                     'official_source_verified':False, 'active_tender_verified':False,
                     'provisional_tender':True}

          def lead(tid='GEM/2026/B/8231919', url='https://thirdparty.test/tender/one', md=None, source='tenders'):
              return SimpleNamespace(category='tender', source=source, tender_id=tid, url=url,
                                     raw_text='relevant bid page', metadata=dict(BASE_MD if md is None else md), id='id')

          l=lead()
          check(unverified(l), 'unverified GeM detected')
          check(provisional(l) == l.tender_id, 'canonical GeM reference extracted')
          check(not namespace['_can_cache_tender_id'](l), 'unverified GeM never enters permanent tender-ID cache')
          check(provisional(lead(tid='GEM/2026/B/X')) == '', 'malformed GeM ID cannot bypass URL gate')
          check(provisional(lead(md={'internal_source':'cppp'})) == '', 'other adapter cannot bypass URL gate')
          check(provisional(lead(md={'internal_source':'gem','verification_status':'official_listing_link','official_source_verified':True,'active_tender_verified':True,'provisional_tender':False})) == '', 'active officially verified GeM does not use provisional recheck')
          check(due(l.tender_id, {}, 7, date(2026,11,10)) == (True,'legacy-first-recheck'), 'legacy processed bid eligible for first bounded recheck')
          check(not due(l.tender_id, {l.tender_id:{'last_ai_attempt':'2026-11-08'}}, 7, date(2026,11,10))[0], 'two-day-old bid is in cooldown')
          check(due(l.tender_id, {l.tender_id:{'last_ai_attempt':'2026-11-03'}}, 7, date(2026,11,10))[0], 'seven-day-old bid eligible')
          check(not due(l.tender_id, None, 7, date(2026,11,10))[0], 'corrupt state prevents URL bypass')
          check(not due(l.tender_id, {l.tender_id:{'last_ai_attempt':'garbled'}}, 7, date(2026,11,10))[0], 'invalid stored date fails closed')

          # Extract the real main() cache gate block: we do not hand-code a stand-in.
          start=SOURCE.index('        c = clean_url(lead.url)\n', SOURCE.index('def main():'))
          stop=SOURCE.index('    log.info(f"After gates:', start)
          fragment=SOURCE[start:stop]
          assert fragment.count('filtered.append(lead)') == 1
          snippet='''def apply_actual_gate(leads, seen, fps, gem_rechecks, gem_recheck_cap=2, gem_recheck_days=7):
              filtered=[]
              pending_next=[]
              run_exact_urls=set()
              max_links=30
              gem_selected_bids=set()
              stats={'gate_url_seen':0, 'gate_fp_dupe':0, 'gate_gem_run_dupe':0, 'gate_gem_cooldown':0,
                     'gate_gem_recheck_limit':0, 'gem_rechecks_selected':0,
                     'gate_budget':0, 'gate_run_url_exact':0}
              for lead in leads:
          '''+fragment+'''    return filtered,stats
          '''
          namespace.update({'clean_url': lambda x:x, '_fingerprint':lambda x: hashlib.sha1(x.encode()).hexdigest()[:16] if x else '', 'log':log})
          exec(compile(snippet,'radar_actual_gate_fragment','exec'),namespace)
          gate=namespace['apply_actual_gate']

          items,stat=gate([l],{l.url},set(),{})
          check(len(items)==1 and stat['gem_rechecks_selected']==1,'legacy seen URL gets one controlled recheck')
          recent={l.tender_id:{'last_ai_attempt':date.today().isoformat()}}
          items,stat=gate([l],{l.url},set(),recent)
          check(len(items)==0 and stat['gate_gem_cooldown']==1,'seen URL in cooldown is excluded')
          new_url=lead(url='https://anotherhost.test/bid/two')
          items,stat=gate([new_url],set(),set(),recent)
          check(len(items)==0 and stat['gate_gem_cooldown']==1,'alternate source URL cannot evade canonical ID cooldown')
          items,stat=gate([new_url],set(),set(),{})
          check(len(items)==1 and stat['gem_rechecks_selected']==0,'brand-new GeM bid stays eligible without spending recheck quota')
          old={l.tender_id:{'last_ai_attempt':(date.today()-timedelta(days=8)).isoformat()}}
          items,stat=gate([l],{l.url}, {hashlib.sha1(l.raw_text.encode()).hexdigest()[:16]},old)
          check(len(items)==1 and stat['gem_rechecks_selected']==1,'due recheck may bypass both old URL and old fingerprint')
          items,stat=gate([l,new_url],{l.url},set(),{})
          check(len(items)==1 and stat['gate_gem_run_dupe']==1,'same canonical bid selected at most once per run')
          three=[lead(tid=f'GEM/2026/B/{i}',url=f'https://host.test/{i}') for i in (12345,23456,34567)]
          items,stat=gate(three,{x.url for x in three},set(),{},2)
          check(len(items)==2 and stat['gate_gem_recheck_limit']==1,'maximum two repeat evaluations per run')
          items,stat=gate([l],{l.url},set(),{},0)
          check(len(items)==0 and stat['gate_gem_recheck_limit']==1,'rechecks can be explicitly disabled')
          non_gem=lead(md={'internal_source':'cppp'})
          items,stat=gate([non_gem],{non_gem.url},set(),{})
          check(len(items)==0 and stat['gate_url_seen']==1,'existing non-GeM URL seen behavior unchanged')

          with tempfile.TemporaryDirectory() as td:
              path=Path(td)/'recheck.json'
              namespace['GEM_RECHECK_FILE']=str(path)
              namespace['DRY_RUN']=True
              check(not write({},l,'REVIEW') and not path.exists(), 'dry-run never persists GeM recheck state')
              namespace['DRY_RUN']=False
              state={}
              check(write(state,l,'REVIEW') and path.exists(),'live successful handling records a recheck state')
              check(read()==state,'new persistent state round-trips accurately')
              payload=json.loads(path.read_text())
              check(payload['version']==1 and payload['bids'][l.tender_id]['outcome']=='REVIEW', 'persistence schema includes canonical bid and outcome')
              path.write_text('{bad json',encoding='utf-8')
              check(read() is None,'malformed persisted state fails closed')

          check('"tender_id", "filing_id"' in SOURCE,'AI verdict cannot overwrite source tender identity')
          check('[GEM-REVIEW-GUARD]' in SOURCE,'Step 30 Review-only guard retained')
          check('if _can_cache_tender_id(lead)' in SOURCE, 'Step 40A completed-tender cache guard retained')
          check('_record_gem_attempt(gem_rechecks, lead, outcome)' in SOURCE, 'successful CRM/manual outcomes persist attempts')
          check('if DRY_RUN:' in SOURCE, 'harvest dry-run branch retained')
          print(f'ALL {checks} TESTS PASSED')
          PY

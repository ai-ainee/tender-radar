              'upcoming_events':'Confirmed event', 'why_engage_now':'Confirmed requirement',
              'signal_freshness':'RECENT'},'Example service','ALL_SECTORS')
          check('verified active GeM route preserved',res3[0]=='INBOX')
          check('verified active GeM summary not scrubbed',s3.posts[0][1]['row_data'][1]=='Confirmed event')
          check('verified active GeM formatter does not claim unverified',
              'SOURCE_VERIFICATION: UNVERIFIED_GEM_REFERENCE' not in format_lead(good,0))

          invalid=lead_with(md)
          s4=Sheet()
          res4=Router(s4).push(invalid,{'organization':'Example Parent Ministry','is_valid':False,
              'confidence':'HIGH','entity_role':'BUYER','lead_score':0,
              'why_engage_now':'Irrelevant','signal_freshness':'RECENT'},'Example service','ALL_SECTORS')
          check('unverified but AI-invalid lead remains Trash',res4[0]=='TRASH')

          print(f'ALL {checks} STEP47D CHECKS PASSED')
          PY

